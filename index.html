<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Расписание 9-ИС403</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="manifest" href="/manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <h1>Расписание <span>9-ИС403</span></h1>
        </div>
        <div class="header-right">
            <div class="header-info">
                <span class="info-item">
                    <i class="fas fa-users"></i>
                    <span class="badge" id="subgroupBadge">1</span>
                </span>
                <span class="info-item">
                    <i class="fas fa-calendar-week"></i>
                    <span id="weekBadge">Авто</span>
                </span>
            </div>
            <button class="burger-btn" id="burgerBtn" aria-label="Меню">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="burger-overlay" id="burgerOverlay"></div>
    <div class="burger-menu" id="burgerMenu">
        <button class="close-btn" id="closeBurger"><i class="fas fa-times"></i></button>
        <div class="menu-title">Настройки</div>

        <button class="burger-item" data-action="subgroup" data-value="1">
            <i class="fas fa-1"></i> Подгруппа 1
            <span class="sub" id="menuSubgroup1">✓</span>
        </button>
        <button class="burger-item" data-action="subgroup" data-value="2">
            <i class="fas fa-2"></i> Подгруппа 2
            <span class="sub" id="menuSubgroup2">✓</span>
        </button>

        <div class="burger-divider"></div>

        <button class="burger-item" data-action="week" data-value="auto">
            <i class="fas fa-magic"></i> Авто
            <span class="sub" id="menuWeekAuto">✓</span>
        </button>
        <button class="burger-item" data-action="week" data-value="1">
            <i class="fas fa-1"></i> 1 неделя
            <span class="sub" id="menuWeek1">✓</span>
        </button>
        <button class="burger-item" data-action="week" data-value="2">
            <i class="fas fa-2"></i> 2 неделя
            <span class="sub" id="menuWeek2">✓</span>
        </button>

        <div class="burger-divider"></div>

        <button class="burger-item" id="menuToday">
            <i class="fas fa-calendar-check"></i> Сегодня
        </button>
        <button class="burger-item" id="menuRefresh">
            <i class="fas fa-sync-alt"></i> Обновить
        </button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <div class="footer-note" id="footerNote">
        <i class="fas fa-clock"></i> Обновлено <span id="updateTime">только что</span>
    </div>

    <script data-goatcounter="https://royskey.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Расписание 9-ИС403</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== ОСНОВНЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg: #f4f4f6;
            --card: #ffffff;
            --accent: #5b7a9a;
            --accent-light: #eef2f6;
            --text-primary: #1e1e1e;
            --text-secondary: #6b6b6b;
            --text-muted: #999999;
            --border: #e8e8ec;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            --radius: 16px;
            --transition: 0.15s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.5rem 1.5rem 2rem;
            line-height: 1.5;
            font-weight: 400;
        }

        /* ===== ХЕДЕР ===== */
        .app-header {
            max-width: 800px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .logo-area h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .logo-area span {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .header-info .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-info .info-item i {
            color: var(--accent);
            font-size: 0.7rem;
        }
        .header-info .info-item .badge {
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.05rem 0.4rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.65rem;
        }

        .burger-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.2rem 0.3rem;
            border-radius: 8px;
            transition: var(--transition);
            line-height: 1;
        }
        .burger-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        /* ===== БУРГЕР-МЕНЮ (оверлей) ===== */
        .burger-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 9998;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .burger-overlay.active {
            display: block;
            opacity: 1;
        }

        .burger-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 280px;
            max-width: 80%;
            height: 100%;
            background: #ffffff;
            box-shadow: -4px 0 30px rgba(0, 0, 0, 0.06);
            z-index: 9999;
            padding: 1.5rem 1.2rem;
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .burger-menu.active {
            transform: translateX(0);
        }

        .burger-menu .close-btn {
            align-self: flex-end;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem;
            margin-bottom: 0.8rem;
        }

        .burger-menu .menu-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.4rem;
        }

        .burger-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .burger-item:hover {
            background: var(--accent-light);
        }
        .burger-item i {
            width: 20px;
            color: var(--accent);
            font-size: 1rem;
        }
        .burger-item .sub {
            margin-left: auto;
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.8rem;
        }
        .burger-item .sub.active-sub {
            color: var(--accent);
            font-weight: 600;
        }

        .burger-divider {
            height: 1px;
            background: var(--border);
            margin: 0.2rem 0;
        }

        /* ===== КАРТОЧКИ ===== */
        .cards-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .day-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeUp 0.3s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-card.today {
            border-left: 3px solid var(--accent);
        }

        .day-card__header {
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: #fafafb;
        }
        .day-card__header .day-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .day-card__header .day-name i {
            color: var(--accent);
            font-size: 0.8rem;
        }
        .day-card__header .day-date {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .day-card.today .day-card__header {
            background: #f8fafc;
        }

        .today-badge {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.55rem;
            font-weight: 600;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== ТАБЛИЦА ===== */
        .lessons-table {
            width: 100%;
            border-collapse: collapse;
        }
        .lessons-table td {
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .lessons-table tr:last-child td {
            border-bottom: none;
        }

        .time-col {
            width: 80px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--accent);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .lesson-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .lesson-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .lesson-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .lesson-meta i {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .lesson-type {
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            font-weight: 500;
        }

        .current-lesson {
            background: #f8fafc;
        }
        .current-lesson .now-indicator {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 6px;
        }

        .note-row td {
            padding: 0.2rem 1.2rem 0.6rem;
            background: #f8f8fa;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        .note-row i {
            color: var(--accent);
            margin-right: 4px;
        }

        /* ===== СКЕЛЕТОН ===== */
        .skeleton {
            background: #e8e8ec;
            border-radius: var(--radius);
            height: 100px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.4;}50%{opacity:0.8;} }

        /* ===== ФУТЕР ===== */
        .footer-note {
            max-width: 800px;
            margin: 2rem auto 0;
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            opacity: 0.5;
            cursor: pointer;
            letter-spacing: 0.3px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 640px) {
            body { padding: 1rem 0.8rem 1.5rem; }
            .app-header { flex-direction: row; flex-wrap: wrap; gap: 0.4rem; }
            .logo-area h1 { font-size: 1.1rem; }
            .header-right { gap: 0.6rem; }
            .header-info { font-size: 0.65rem; gap: 0.5rem; }
            .burger-btn { font-size: 1.2rem; }
            .lessons-table td { padding: 0.6rem 0.8rem; }
            .time-col { width: 65px; font-size: 0.75rem; }
            .lesson-name { font-size: 0.8rem; }
            .burger-menu { width: 260px; }
        }
    </style>
</head>
<body>

    <!-- ===== ХЕДЕР ===== -->
    <header class="app-header">
        <div class="logo-area">
            <h1>Расписание <span>9-ИС403</span></h1>
        </div>
        <div class="header-right">
            <div class="header-info">
                <span class="info-item">
                    <i class="fas fa-users"></i>
                    <span class="badge" id="subgroupBadge">1</span>
                </span>
                <span class="info-item">
                    <i class="fas fa-calendar-week"></i>
                    <span id="weekBadge">Авто</span>
                </span>
            </div>
            <button class="burger-btn" id="burgerBtn" aria-label="Меню">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- ===== БУРГЕР ОВЕРЛЕЙ ===== -->
    <div class="burger-overlay" id="burgerOverlay"></div>

    <!-- ===== БУРГЕР МЕНЮ ===== -->
    <div class="burger-menu" id="burgerMenu">
        <button class="close-btn" id="closeBurger"><i class="fas fa-times"></i></button>
        <div class="menu-title">Настройки</div>

        <!-- Подгруппа -->
        <button class="burger-item" data-action="subgroup" data-value="1">
            <i class="fas fa-1"></i> Подгруппа 1
            <span class="sub" id="menuSubgroup1">✓</span>
        </button>
        <button class="burger-item" data-action="subgroup" data-value="2">
            <i class="fas fa-2"></i> Подгруппа 2
            <span class="sub" id="menuSubgroup2">✓</span>
        </button>

        <div class="burger-divider"></div>

        <!-- Неделя -->
        <button class="burger-item" data-action="week" data-value="auto">
            <i class="fas fa-magic"></i> Авто
            <span class="sub" id="menuWeekAuto">✓</span>
        </button>
        <button class="burger-item" data-action="week" data-value="1">
            <i class="fas fa-1"></i> 1 неделя
            <span class="sub" id="menuWeek1">✓</span>
        </button>
        <button class="burger-item" data-action="week" data-value="2">
            <i class="fas fa-2"></i> 2 неделя
            <span class="sub" id="menuWeek2">✓</span>
        </button>

        <div class="burger-divider"></div>

        <!-- Действия -->
        <button class="burger-item" id="menuToday">
            <i class="fas fa-calendar-check"></i> Сегодня
        </button>
        <button class="burger-item" id="menuRefresh">
            <i class="fas fa-sync-alt"></i> Обновить
        </button>
    </div>

    <!-- ===== КАРТОЧКИ ===== -->
    <div class="cards-container" id="cardsContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <!-- ===== ФУТЕР ===== -->
    <div class="footer-note" id="footerNote">
        <i class="fas fa-clock"></i> Обновлено <span id="updateTime">только что</span>
    </div>

    <!-- ===== СКРИПТ ===== -->
    <script>
        // === STORE ===
        const Store = {
            get(k, d) { try { const v = localStorage.getItem('schedule_app_' + k); return v !== null ? JSON.parse(v) : d; } catch { return d; } },
            set(k, v) { localStorage.setItem('schedule_app_' + k, JSON.stringify(v)); }
        };

        // === PARSER ===
        const ScheduleParser = {
            parseSemester(html) {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                let table = doc.querySelector('#schedule_table_och_sem .schedule_table table');
                if (!table) table = doc.querySelector('#schedule_table_och_sem table');
                if (!table) table = doc.querySelector('.schedule_table table');
                if (!table) return [];
                const rows = table.querySelectorAll('tbody tr');
                const result = [];
                let currentDay = '';
                const dayNames = ['пн','вт','ср','чт','пт','сб','вс'];
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const cells = row.querySelectorAll('td');
                    if (cells.length < 4) continue;
                    const first = cells[0];
                    let dayText = first.innerText.trim().toLowerCase().replace(/[^а-я]/g, '');
                    let isDay = first.classList && first.classList.contains('day-header');
                    if (!isDay && dayText.length >= 2 && dayNames.includes(dayText.substring(0,2))) {
                        isDay = true;
                        dayText = dayText.substring(0,2);
                    }
                    if (isDay && dayText.length >= 2) { currentDay = dayText.substring(0,2); }
                    if (!currentDay) continue;
                    const timeCell = cells[1];
                    let timeText = '';
                    const timeDiv = timeCell.querySelector('.time');
                    if (timeDiv) timeText = timeDiv.innerText.trim();
                    if (!timeText) {
                        const ext = timeCell.querySelector('.extend_time');
                        if (ext) timeText = ext.innerText.trim().split('--')[0];
                    }
                    const startTime = this._normalizeTime(timeText);
                    if (!startTime) continue;
                    const lesson1 = this._parseLesson(cells[2]);
                    const lesson2 = this._parseLesson(cells[3]);
                    if (lesson1 && lesson1.name && lesson1.name.length >= 2) {
                        result.push({ day: currentDay, time: startTime, week: 1, ...lesson1 });
                    }
                    if (lesson2 && lesson2.name && lesson2.name.length >= 2) {
                        result.push({ day: currentDay, time: startTime, week: 2, ...lesson2 });
                    }
                }
                return result;
            },
            _normalizeTime(str) {
                if (!str) return '';
                const m = str.match(/(\d{1,2}):(\d{2})/);
                if (!m) return '';
                let h = parseInt(m[1], 10) % 24;
                let min = parseInt(m[2], 10) % 60;
                return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
            },
            _parseLesson(cell) {
                if (!cell) return null;
                const html = cell.innerHTML.trim();
                if (!html || html === '&nbsp;') return null;
                let name = '';
                const main = cell.querySelector('.mainScheduleInfo');
                if (main) {
                    let text = main.innerText.trim();
                    let parts = text.split(',');
                    name = parts[0].trim();
                    if (name.includes(' - ')) name = name.split(' - ')[0].trim();
                } else {
                    const short = cell.querySelector('.ShortScheduleInfo');
                    if (short) {
                        let text = short.innerText.trim();
                        let parts = text.split(',');
                        name = parts[0].trim();
                        if (name.includes(' - ')) name = name.split(' - ')[0].trim();
                    }
                }
                if (!name || name.length < 2) return null;
                let type = '';
                const typeDiv = cell.querySelector('.small.text-muted');
                if (typeDiv) type = typeDiv.innerText.trim();
                let location = '—';
                const roomLink = cell.querySelector('a[href*="/room/"]');
                if (roomLink) {
                    let roomText = roomLink.innerText.trim();
                    const parentText = roomLink.parentNode.innerText;
                    const matchExtra = parentText.match(/,\s*(.+?)(?:\s*<|$)/);
                    if (matchExtra && matchExtra[1].trim() !== roomText) {
                        location = roomText + ' ' + matchExtra[1].trim();
                    } else {
                        location = roomText;
                    }
                } else if (cell.innerText.includes('неизв.')) {
                    location = 'неизв.';
                }
                return { name, type, location };
            }
        };

        // === APP ===
        class ScheduleApp {
            constructor() {
                this.baseUrl = 'https://rasps.nsuem.ru/group/9-%D0%98%D0%A1403/';
                this.subgroup = Store.get('subgroup', '1');
                this.week = Store.get('week', 'auto');
                this.notes = Store.get('notes', {});
                this.cachedData = Store.get('cachedData', null);
                this.lastUpdate = Store.get('lastUpdate', null);
                this.initUI();
                this.loadData(true);
                setInterval(() => this.loadData(true), 600000);
            }

            initUI() {
                this.updateHeaderAndMenu();

                // Бургер
                const burgerBtn = document.getElementById('burgerBtn');
                const overlay = document.getElementById('burgerOverlay');
                const menu = document.getElementById('burgerMenu');
                const closeBtn = document.getElementById('closeBurger');

                const open = () => {
                    menu.classList.add('active');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                };
                const close = () => {
                    menu.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                };

                burgerBtn.addEventListener('click', open);
                closeBtn.addEventListener('click', close);
                overlay.addEventListener('click', close);

                // Пункты меню: подгруппа
                document.querySelectorAll('[data-action="subgroup"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.dataset.value;
                        if (val) this.changeSubgroup(val);
                        close();
                    });
                });

                // Пункты меню: неделя
                document.querySelectorAll('[data-action="week"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.dataset.value;
                        if (val) this.setWeek(val);
                        close();
                    });
                });

                // Сегодня
                document.getElementById('menuToday').addEventListener('click', () => {
                    this.scrollToToday();
                    close();
                });

                // Обновить
                document.getElementById('menuRefresh').addEventListener('click', () => {
                    this.forceRefresh();
                    close();
                });

                // Футер для отладки
                document.getElementById('footerNote').addEventListener('click', () => this.debugInfo());
            }

            updateHeaderAndMenu() {
                // Хедер
                document.getElementById('subgroupBadge').textContent = this.subgroup;
                const weekLabel = this.week === 'auto' ? 'Авто' : this.week + ' нед.';
                document.getElementById('weekBadge').textContent = weekLabel;

                // Меню: галочки для подгруппы
                document.querySelectorAll('[data-action="subgroup"] .sub').forEach(el => el.style.display = 'none');
                const sg1 = document.getElementById('menuSubgroup1');
                const sg2 = document.getElementById('menuSubgroup2');
                if (this.subgroup === '1') sg1.style.display = 'inline';
                else sg2.style.display = 'inline';

                // Меню: галочки для недели
                document.querySelectorAll('[data-action="week"] .sub').forEach(el => el.style.display = 'none');
                const wAuto = document.getElementById('menuWeekAuto');
                const w1 = document.getElementById('menuWeek1');
                const w2 = document.getElementById('menuWeek2');
                if (this.week === 'auto') wAuto.style.display = 'inline';
                else if (this.week === '1') w1.style.display = 'inline';
                else if (this.week === '2') w2.style.display = 'inline';
            }

            getActualWeek() {
                if (this.week !== 'auto') return parseInt(this.week, 10);
                const start = new Date(2024, 8, 1);
                const diff = Math.floor((new Date() - start) / (1000 * 60 * 60 * 24 * 7));
                return (diff % 2 === 0) ? 1 : 2;
            }

            async loadData(useCache = true) {
                const container = document.getElementById('cardsContainer');
                if (!useCache || !this.cachedData) {
                    container.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
                }
                try {
                    const url = this.baseUrl + this.subgroup;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Ошибка');
                    const html = await res.text();
                    const data = ScheduleParser.parseSemester(html);
                    if (data.length === 0) throw new Error('Нет данных');
                    this.cachedData = data;
                    Store.set('cachedData', data);
                    const now = new Date().toLocaleString('ru-RU');
                    this.lastUpdate = now;
                    Store.set('lastUpdate', now);
                    document.getElementById('updateTime').textContent = now;
                    this.render(data);
                } catch (err) {
                    if (this.cachedData && useCache) {
                        this.render(this.cachedData);
                        document.getElementById('updateTime').textContent = 'кеш от ' + (this.lastUpdate || '');
                    } else {
                        container.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-muted);"><i class="fas fa-wifi-slash" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>Не удалось загрузить</div>`;
                    }
                }
            }

            render(data) {
                const container = document.getElementById('cardsContainer');
                const targetWeek = this.getActualWeek();
                const filtered = data.filter(l => l.week === targetWeek);
                if (filtered.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-muted);">Нет пар на этой неделе</div>`;
                    return;
                }

                const daysMap = new Map();
                filtered.forEach(l => {
                    if (!daysMap.has(l.day)) daysMap.set(l.day, []);
                    daysMap.get(l.day).push(l);
                });

                const todayShort = new Date().toLocaleDateString('ru-RU', { weekday: 'short' }).toLowerCase().slice(0, 2);
                const fullDays = { 'пн':'Понедельник','вт':'Вторник','ср':'Среда','чт':'Четверг','пт':'Пятница','сб':'Суббота','вс':'Воскресенье' };

                let html = '';
                let delay = 0;
                for (const [day, lessons] of daysMap) {
                    const isToday = day.toLowerCase().startsWith(todayShort);
                    const fullName = fullDays[day] || day.toUpperCase();
                    const dateStr = this.getDateForDay(day);
                    html += `
                        <div class="day-card ${isToday ? 'today' : ''}" style="animation-delay:${delay}s">
                            <div class="day-card__header">
                                <span class="day-name">
                                    <i class="fas fa-calendar-day"></i> ${fullName}
                                    ${isToday ? '<span class="today-badge">сегодня</span>' : ''}
                                </span>
                            </div>
                            <table class="lessons-table">
                    `;
                    lessons.forEach(l => {
                        const key = `${day}_${l.time}_${l.week}`;
                        const isNow = isToday && this.isCurrentLesson(l.time);
                        const note = this.notes[key] || '';
                        const endTime = this.addMinutes(l.time, 90);
                        const roomHtml = this.formatRoom(l.location);
                        const lessonName = this.escapeHtml(l.name || '');
                        const lessonType = this.escapeHtml(l.type || '');
                        const typeIcon = this.getTypeIcon(l.type);

                        html += `
                            <tr class="${isNow ? 'current-lesson' : ''}" onclick="app.toggleNote('${key.replace(/'/g, "\\'")}')">
                                <td class="time-col">${this.escapeHtml(l.time)}–${endTime}</td>
                                <td>
                                    <div class="lesson-info">
                                        <div class="lesson-name">${lessonName}</div>
                                        <div class="lesson-meta">
                                            ${lessonType ? `<span class="lesson-type"><i class="${typeIcon}"></i> ${lessonType}</span>` : ''}
                                            <span><i class="fas fa-location-dot"></i> ${roomHtml}</span>
                                            ${isNow ? '<span class="now-indicator"></span>' : ''}
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                        if (note) {
                            html += `
                                <tr class="note-row">
                                    <td colspan="2"><i class="fas fa-pen"></i> ${this.escapeHtml(note)}</td>
                                </tr>
                            `;
                        }
                    });
                    html += `</table></div>`;
                    delay += 0.04;
                }
                container.innerHTML = html;
            }

            // ===== ИСПРАВЛЕННАЯ ФУНКЦИЯ ДЛЯ ДАТ =====
            getDateForDay(dayShort) {
                const daysMap = { 'пн':0, 'вт':1, 'ср':2, 'чт':3, 'пт':4, 'сб':5, 'вс':6 };
                const targetNum = daysMap[dayShort];
                if (targetNum === undefined) return '';

                const now = new Date();
                const todayNum = now.getDay(); // 0=вс, 1=пн, ...
                // Приводим к формату: пн=0, вт=1, ..., вс=6
                const todayNumAdjusted = (todayNum === 0) ? 6 : todayNum - 1;

                // Находим понедельник этой недели
                const diffToMonday = todayNumAdjusted;
                const monday = new Date(now);
                monday.setDate(now.getDate() - diffToMonday);

                // Целевая дата = понедельник + targetNum дней
                const targetDate = new Date(monday);
                targetDate.setDate(monday.getDate() + targetNum);

                return targetDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            }

            getTypeIcon(type) {
                const t = (type || '').toLowerCase();
                if (t.includes('лек')) return 'fas fa-chalkboard-teacher';
                if (t.includes('практ')) return 'fas fa-users-cog';
                if (t.includes('лаб')) return 'fas fa-flask';
                return 'fas fa-book';
            }

            isCurrentLesson(startTime) {
                if (!startTime) return false;
                const [h, m] = startTime.split(':').map(Number);
                const now = new Date();
                const start = h * 60 + m;
                const current = now.getHours() * 60 + now.getMinutes();
                return current >= start && current < start + 95;
            }

            addMinutes(time, mins) {
                if (!time) return '--:--';
                const [h, m] = time.split(':').map(Number);
                const total = h * 60 + m + mins;
                const nh = Math.floor(total / 60) % 24;
                const nm = total % 60;
                return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
            }

            formatRoom(loc) { return (!loc || loc === '—') ? '—' : loc; }
            escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m] || m); }

            toggleNote(key) {
                const current = this.notes[key] || '';
                const newNote = prompt('Заметка для пары:', current);
                if (newNote === null) return;
                if (newNote.trim() === '') delete this.notes[key];
                else this.notes[key] = newNote.trim();
                Store.set('notes', this.notes);
                if (this.cachedData) this.render(this.cachedData);
                else this.loadData(true);
            }

            changeSubgroup(val) {
                if (this.subgroup === val) return;
                this.subgroup = val;
                Store.set('subgroup', val);
                this.updateHeaderAndMenu();
                this.loadData(false);
            }

            setWeek(val) {
                if (this.week === val) return;
                this.week = val;
                Store.set('week', val);
                this.updateHeaderAndMenu();
                if (this.cachedData) this.render(this.cachedData);
                else this.loadData(true);
            }

            forceRefresh() {
                this.loadData(false);
            }

            scrollToToday() {
                const el = document.querySelector('.day-card.today');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                else alert('Сегодня пар нет.');
            }

            debugInfo() {
                alert(`Подгруппа: ${this.subgroup}\nНеделя: ${this.week}\nЗаметок: ${Object.keys(this.notes).length}`);
            }
        }

        const app = new ScheduleApp();
    </script>

        async src="//gc.zgo.at/count.js"></script>

    
<!-- Скрипт для отслеживания кнопок настроек -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // Каждые 100мс проверяем, загрузился ли счетчик в браузере
    const checkGoat = setInterval(() => {
      if (window.goatcounter && window.goatcounter.count) {
        clearInterval(checkGoat);
        
        // Функция для привязки события к тексту кнопки
        const trackButtonClick = (buttonText, eventPath, eventTitle) => {
          // Ищем кнопку по тексту внутри нее
          const buttons = Array.from(document.querySelectorAll('button'));
          const targetButton = buttons.find(btn => btn.textContent.includes(buttonText));
          
          if (targetButton) {
            targetButton.addEventListener('click', () => {
              window.goatcounter.count({
                path:  eventPath,
                title: eventTitle,
                event: true, // Помечаем в панели GoatCounter как "событие", а не просмотр страницы
              });
            });
          }
        };

        // Привязываем отслеживание к вашим кнопкам
        trackButtonClick('Подгруппа 1', 'click-subgroup-1', 'Выбор Подгруппы 1');
        trackButtonClick('Подгруппа 2', 'click-subgroup-2', 'Выбор Подгруппы 2');
        trackButtonClick('1 неделя', 'click-week-1', 'Просмотр 1 недели');
        trackButtonClick('2 неделя', 'click-week-2', 'Просмотр 2 недели');
        trackButtonClick('Сегодня', 'click-today', 'Клик по кнопке Сегодня');
        trackButtonClick('Обновить', 'click-refresh', 'Ручное обновление расписания');
      }
    }, 100);
  });
</script>
